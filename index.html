<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="main.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>
            <i class="bi bi-list-task"></i> Minha Lista de Tarefas
        </h1>
    </header>

    <main>
        <section>
            <form id="task-form">
                <input type="text" id="task-input" required placeholder="Adicione uma nova tarefa">
                <button type="submit" id="add-task-btn">
                    <i class="bi bi-plus-circle"></i> Adicionar
                </button>
            </form>
            <ul id="task-list"></ul>
        </section>
    </main>

    <footer>
       <a href="" target="_blank">
           <i class="bi bi-heart-fill"></i> 2025 Minha Lista de Tarefas - By Éber lindo.
       </a>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="main.js"></script>
</body>
</html>
